[package]
name = "dtrexp-wasm"
version = "1.0.0"
edition = "2021"
description = "DTRExp for WebAssembly — the dtrexp Rust core compiled for JS hosts (spec draft 2.9)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dtrexp = { version = "1", features = ["host-tz"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
